<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Preview - ResTail</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #09090b; /* Zinc-950 */
      color: #f4f4f5; /* Zinc-100 */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      height: 64px;
      background-color: rgba(9, 9, 11, 0.8); /* Zinc-950 with transparency */
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); /* Blue to Purple */
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .subtitle {
      font-size: 12px;
      color: #a1a1aa; /* Zinc-400 */
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-cancel {
      background-color: transparent;
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-cancel:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-download {
      background: linear-gradient(135deg, #2563eb, #7c3aed); /* Royal Blue to Violet */
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      filter: brightness(1.1);
    }
    .btn-download:active {
      transform: translateY(0);
    }
    .viewer-container {
      flex: 1;
      width: 100%;
      background-color: #18181b; /* Zinc-900 */
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #18181b;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #a1a1aa;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-section">
      <div class="logo-icon">R</div>
      <div>
        <div class="title" id="resume-title">Tailored_Resume.pdf</div>
        <div class="subtitle">ResTail Resume Previewer</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-cancel" id="btn-close">Close Preview</button>
      <button class="btn btn-download" id="btn-download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download PDF
      </button>
    </div>
  </div>
  <div class="viewer-container">
    <div class="loader" id="preview-loader">
      <div class="spinner"></div>
      <div>Loading PDF preview...</div>
    </div>
    <iframe id="pdf-frame" style="display: none;"></iframe>
  </div>
  <script src="preview.js"></script>
</body>
</html>
