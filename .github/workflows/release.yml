name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install

    - name: Build extension
      run: pnpm build

    - name: Zip extension
      run: |
        cd dist
        zip -r ../ResTail-${{ github.ref_name }}.zip ./*
        cd ..
        
    - name: Zip dist folder
      run: zip -r ResTail-dist-${{ github.ref_name }}.zip dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ResTail-${{ github.ref_name }}.zip
          ResTail-dist-${{ github.ref_name }}.zip
        generate_release_notes: true
